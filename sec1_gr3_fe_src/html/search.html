<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Samud Trade | Search</title>
    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/searchbar.css" rel="stylesheet" />
    <link href="../css/showitem.css" rel="stylesheet" />
    <script src="../js/api.js" defer></script>
    <script src="../js/search.js" defer></script>
</head>

<body class="page-search">

    <header>
        <a href="/home" id="homeLink">
            <div>samud trade</div>
        </a>

        <nav>
            <!-- User Navbar -->
            <div id="userNav">
                <a class="nav" href="/trade">trade</a>
                <span>|</span>

                <a class="nav" href="/my-item">my item</a>
                <span>|</span>

                <a class="nav" href="/match">match</a>
                <span>|</span>
                <a class="nav" href="/wait">wait</a>
            </div>

            <!-- Admin Navbar -->
            <!--
                เมนูสำหรับ Admin
                hidden ซ่อนเมนูไว้ก่อน
                Js แสดงเมนูตาม Role ของผู้ใช้
            -->
            <div id="adminNav" hidden>
                <a class="nav" href="/admin-management">
                    Management
                </a>
            </div>
        </nav>

        <a class="profile" href="/profile" id="profileLink">
            <svg class="profile-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>

    <!-- ส่วนหลักสำหรับค้นหาหนังสือ -->
    <main class="search" id="search_content">
        <h2 class="searchtitle">Search</h2>
        <form action="#" id="search_form" method="get">
            <div class="searchname">
                <label for="name">Book name / Keyword</label>
                <input id="name" name="name" placeholder="Enter name or keyword." type="text" />
            </div>
            <div class="searchcategory">
                <label for="category">category</label>
                <select id="category" name="category">
                    <option value="">--all--</option>
                    <option value="art-design">art &amp; design</option>
                    <option value="biography">biography</option>
                    <option value="business">business</option>
                    <option value="children">children</option>
                    <option value="comic">comic</option>
                    <option value="cooking">cooking</option>
                    <option value="exam-prep">exam prep</option>
                    <option value="fantasy">fantasy</option>
                    <option value="finance">finance</option>
                    <option value="health">health</option>
                    <option value="history">history</option>
                    <option value="horror">horror</option>
                    <option value="language">language</option>
                    <option value="light-novel">light novel</option>
                    <option value="magazine">magazine</option>
                    <option value="manga">manga</option>
                    <option value="mystery">mystery</option>
                    <option value="novel">novel</option>
                    <option value="other">other</option>
                    <option value="programming">programming</option>
                    <option value="psychology">psychology</option>
                    <option value="religion">religion</option>
                    <option value="romance">romance</option>
                    <option value="science">science</option>
                    <option value="sci-fi">sci-fi</option>
                    <option value="self-help">self-help</option>
                    <option value="technology">technology</option>
                    <option value="textbook">textbook</option>
                    <option value="thriller">thriller</option>
                    <option value="travel">travel</option>
                </select>
            </div>
            <div class="searchprice">
                <label for="min">Price range</label>
                <input id="min" name="min" placeholder="Min" type="number" />
                <input id="max" name="max" placeholder="Max" type="number" />
            </div>
            <fieldset class="searchcondition">
                <legend>Condition</legend>
                <div class="stars">
                    <input id="star5" name="condition" type="radio" value="5" />
                    <label for="star5" title="5 ดาว">★</label>
                    <input id="star4" name="condition" type="radio" value="4" />
                    <label for="star4" title="4 ดาว">★</label>
                    <input id="star3" name="condition" type="radio" value="3" />
                    <label for="star3" title="3 ดาว">★</label>
                    <input id="star2" name="condition" type="radio" value="2" />
                    <label for="star2" title="2 ดาว">★</label>
                    <input id="star1" name="condition" type="radio" value="1" />
                    <label for="star1" title="1 ดาว">★</label>
                </div>
            </fieldset>
            <div class="searchbtn">
                <button class="clear" type="reset">Clear</button>
                <button class="submit" type="submit">Search</button>
            </div>
        </form>
        <p class="search-status" id="search_status"></p>
    </main>
    <section class="show" id="search_results">
        <div class="item">
            <img alt="Book or profile image" src="../pic" />
            <p class="itemname">name</p>
            <p class="info">info</p>
            <a href="/detail-item">detail</a>
        </div>
        <div class="item">
            <img alt="Book or profile image" src="../pic" />
            <p class="itemname">name</p>
            <p class="info">info</p>
            <a href="/detail-item">detail</a>
        </div>
        <div class="item">
            <img alt="Book or profile image" src="../pic" />
            <p class="itemname">name</p>
            <p class="info">info</p>
            <a href="/detail-item">detail</a>
        </div>
        <div class="item">
            <img alt="Book or profile image" src="../pic" />
            <p class="itemname">name</p>
            <p class="info">info</p>
            <a href="/detail-item">detail</a>
        </div>
        <div class="item">
            <img alt="Book or profile image" src="../pic" />
            <p class="itemname">name</p>
            <p class="info">info</p>
            <a href="/detail-item">detail</a>
        </div>
        <div class="item">
            <img alt="Book or profile image" src="../pic" />
            <p class="itemname">name</p>
            <p class="info">info</p>
            <a href="/detail-item">detail</a>
        </div>
        <div class="item">
            <img alt="Book or profile image" src="../pic" />
            <p class="itemname">name</p>
            <p class="info">info</p>
            <a href="/detail-item">detail</a>
        </div>
    </section>
    <footer>
        <div>
            <a href="/team">
                <p class="team">about us</p>
            </a>
        </div>
        <div>
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>

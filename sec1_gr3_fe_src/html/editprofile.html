    <main class="admin-page">

        <section class="admin-box">

            <h2>Add user</h2>

            <form class="add-user-form" id="addUserForm">

                <div class="field-row">
                    <label for="Role">Role</label>

                    <select name="role" id="">
                        <option value="admin">admin</option>
                        <option value="user">user</option>
                    </select>
                </div>

                <div class="field-row">
                    <label for="firstname">First Name</label>

                    <input
                        type="text"
                        id="firstname"
                        name="firstname"
                        placeholder="first name"
                        required
                    >
                </div>


                <div class="field-row">
                    <label for="lastname">Last Name</label>

                    <input
                        type="text"
                        id="lastname"
                        name="lastname"
                        placeholder="last name"
                        required
                    >
                </div>


                <div class="field-row">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="username"
                        required
                    >
                </div>


                <div class="field-row">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="password"
                        required
                    >
                </div>


                <div class="field-row">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="confirm password"
                        required
                    >
                </div>


                <div class="form-buttons">

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="location.href='UserManage.html'"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Add user
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script>

        const form = document.getElementById('addUserForm');

        form.addEventListener('submit', (e) => {

            e.preventDefault();

            const password =
                document.getElementById('password').value;

            const confirmPassword =
                document.getElementById('confirmPassword').value;


            // ตรวจสอบว่า Password ตรงกันหรือไม่
            if (password !== confirmPassword) {

                alert('Password does not match');

                return;
            }


            // ตอนนี้ยังไม่มี Backend
            // เมื่อกด Add user จะกลับไปหน้า User Management

            location.href = 'UserManage.html';

        });

    </script>

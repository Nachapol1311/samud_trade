    <main class="admin-page" id="editprofile_content">
        <section class="admin-box">
            <h2>Add user</h2>
            <form action="#" class="add-user-form" id="addUserForm" method="post">
                <div class="field-row">
                    <label for="Role">Role</label>
                    <select id="editprofile_role" name="role">
                        <option value="admin">admin</option>
                        <option value="user">user</option>
                    </select>
                </div>
                <div class="field-row">
                    <label for="firstname">First Name</label>
                    <input id="firstname" name="firstname" placeholder="first name" required="" type="text" />
                </div>
                <div class="field-row">
                    <label for="lastname">Last Name</label>
                    <input id="lastname" name="lastname" placeholder="last name" required="" type="text" />
                </div>
                <div class="field-row">
                    <label for="username">Username</label>
                    <input id="username" name="username" placeholder="username" required="" type="text" />
                </div>
                <div class="field-row">
                    <label for="password">Password</label>
                    <input id="password" name="password" placeholder="password" required="" type="password" />
                </div>
                <div class="field-row">
                    <label for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword" name="confirmPassword" placeholder="confirm password" required=""
                        type="password" />
                </div>
                <div class="form-buttons">
                    <a class="cancel-btn" href="UserManage.html">
                        Cancel
                    </a>
                    <button class="save-btn" type="submit">
                        Add user
                    </button>
                </div>
            </form>
        </section>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Samud Trade | Detailitem</title>
    <script src="../js/api.js" defer></script>
    <script src="../js/detailitem.js" defer></script>
    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/detail.css" rel="stylesheet" />
</head>

<body class="page-detailitem">

    <header>
        <a href="/home" id="homeLink">
            <div>samud trade</div>
        </a>

        <nav>
            <!-- User Navbar -->
            <div id="userNav">
                <a class="nav" href="/search">⌕ search</a>
                <span>|</span>
                <a class="nav" href="/trade">trade</a>
                <span>|</span>
                <a class="nav" href="/my-item">my item</a>
                <span>|</span>
                <a class="nav" href="/match">match</a>
                <span>|</span>
                <a class="nav" href="/wait">wait</a>
            </div>

            <!-- Admin Navbar -->
            <div id="adminNav" hidden>
                <a class="nav" href="/admin-management">
                    management
                </a>
            </div>
        </nav>

        <a class="profile" href="/profile" id="profileLink">
            <svg class="profile-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>


    <h1 class="detail-title">│Book Details</h1>

    <main class="infomation" id="detailitem_content">
        <div class="detail">
            <img alt="Book or profile image" id="d_img" src="" />
        </div>
        <div class="detail">
            <div>
                <p>Book:</p>
                <p id="d_name">xxx</p>
            </div>
            <div>
                <p>Category:</p>
                <p id="d_category">xxx</p>
            </div>
            <div>
                <p>Price:</p>
                <p id="d_price">xxx</p>
            </div>
            <div>
                <p>Condition:</p>
                <p id="d_condition">xxx</p>
            </div>
            <div>
                <p>Owner:</p>
                <p id="d_owner">xxx</p>
            </div>
            <div id="info-detail">
                <p>detail</p>
                <p id="d_detail"></p>
            </div>
        </div>
        <div>
            <button id="d_ignore" type="button">ignore</button>
            <button id="d_interest" type="button">interest</button>
        </div>
    </main>

    <footer>
        <div>
            <a href="/team">
                <p class="team">about us</p>
            </a>
        </div>
        <div>
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>

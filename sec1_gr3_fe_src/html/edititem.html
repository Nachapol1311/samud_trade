<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Samud Trade | Edititem</title>
    <script src="../js/api.js" defer></script>
    <script src="../js/edititem.js" defer></script>
    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/additem.css" rel="stylesheet" />
</head>

<body class="page-edititem">
    <header>
        <!-- Logo -->
        <a href="/home" id="homeLink">
            <div>samud trade</div>
        </a>


        <!-- แถบเมนูนำทาง (Navigation bar) เชื่อมไปยังหน้าหลักของเว็บ -->

        <a class="profile" href="/login">
            <svg class="profile-icon" viewbox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>

    </header>

    <main class="additem" id="edititem_content">
        <h2>Edit Book</h2>
        <div class="detail">
            <img alt="Book or profile image" id="book_preview" src="" />
        </div>
        <div class="detail">
            <div>
                <p>Book</p>
                <input id="book_name" maxlength="100" placeholder="Enter book" type="text" />
            </div>
            <div>
                <p>Catagory</p>
                <select id="category" name="category">
                    <option value="">-- select category --</option>
                    <option value="art-design">art &amp; design</option>
                    <option value="biography">biography</option>
                    <option value="business">business</option>
                    <option value="children">children</option>
                    <option value="comic">comic</option>
                    <option value="cooking">cooking</option>
                    <option value="exam-prep">exam prep</option>
                    <option value="fantasy">fantasy</option>
                    <option value="finance">finance</option>
                    <option value="health">health</option>
                    <option value="history">history</option>
                    <option value="horror">horror</option>
                    <option value="language">language</option>
                    <option value="light-novel">light novel</option>
                    <option value="magazine">magazine</option>
                    <option value="manga">manga</option>
                    <option value="mystery">mystery</option>
                    <option value="novel">novel</option>
                    <option value="other">other</option>
                    <option value="programming">programming</option>
                    <option value="psychology">psychology</option>
                    <option value="religion">religion</option>
                    <option value="romance">romance</option>
                    <option value="science">science</option>
                    <option value="sci-fi">sci-fi</option>
                    <option value="self-help">self-help</option>
                    <option value="technology">technology</option>
                    <option value="textbook">textbook</option>
                    <option value="thriller">thriller</option>
                    <option value="travel">travel</option>
                </select>
            </div>
            <div>
                <p>Price</p>
                <input id="book_price" min="0" placeholder="Price" type="number" />
            </div>
            <div>
                <p>Condition</p>
                <div class="stars">
                    <input id="star5" name="condition" type="radio" value="5" />
                    <label for="star5" title="5 ดาว">★</label>
                    <input id="star4" name="condition" type="radio" value="4" />
                    <label for="star4" title="4 ดาว">★</label>
                    <input id="star3" name="condition" type="radio" value="3" />
                    <label for="star3" title="3 ดาว">★</label>
                    <input id="star2" name="condition" type="radio" value="2" />
                    <label for="star2" title="2 ดาว">★</label>
                    <input id="star1" name="condition" type="radio" value="1" />
                    <label for="star1" title="1 ดาว">★</label>
                </div>
            </div>
            <div>
                <p>Owner</p>
                <p id="book_owner">info-owner</p>
            </div>
            <div id="info-detail">
                <p>detail</p>
                <textarea id="book_detail" maxlength="255" name="deteil"></textarea>
            </div>

            <div>
                <p>Book Image</p>
                <input id="book_image" type="file" accept="image/*" />
            </div>
        </div>
        <div>
            <a href="/my-item" class="cancel-btn" id="cancelLink">
                Cancel
            </a>

            <button type="button" class="save-btn" id="saveBtn">
                Save
            </button>
        </div>
    </main>

    <footer>
        <div>
            <a href="/team">
                <p class="team">about us</p>
            </a>
        </div>

        <div>
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>

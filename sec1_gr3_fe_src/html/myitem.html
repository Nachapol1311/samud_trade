<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Samud Trade | Myitem</title>
    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/showitem.css" rel="stylesheet" />
</head>

<body class="page-myitem">
    <!-- ส่วนหัวหน้า (header): โลโก้ลิงก์กลับหน้าแรก, แถบนำทาง (nav) และไอคอนโปรไฟล์ลิงก์ไปหน้า login และลิงก์ + add product -->
    <header>
        <a href="/home">
            <div>samud trade</div>
        </a>

        <nav>
            <div>
                <a class="nav" href="/search">⌕ search</a>
                <span>|</span>
                <a class="nav" href="/trade">trade</a>
                <span>|</span>
                <a class="nav" href="/match">match</a>
                <span>|</span>
                <a class="nav" href="/wait">wait</a>
            </div>
        </nav>

        <a class="profile" href="/login">
            <svg class="profile-icon" viewbox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>

    </header>

    <!-- หัวข้อหน้าและปุ่มไปหน้าเพิ่มหนังสือ (add product) -->
    <main id="myitem_content">
        <div>
            <h2>Manage Your Books</h2>
            Add and manage the books you want to trade.
        </div>

        <div>
            <a href="/add-item">add product</a>
        </div>
    </main>

    <!-- รายการหนังสือของผู้ใช้ที่ login อยู่: myitem.js เรียก GET /books/mine แล้วสร้างการ์ดพร้อมปุ่ม edit และ remove -->
    <!-- (remove เรียก DELETE /books/:id) การ์ดข้างล่างเป็นโครงตัวอย่าง -->
    <h1 class="itemtitle">│My Items</h1>

    <section class="show" id="myitem_list">
        <div class="item">
            <img alt="Book or profile image" src="../pic" />
            <p class="itemname">name</p>
            <p class="info">info</p>
            <a href="/edit-item" id="editbtn">edit</a>
            <p>remove</p>
        </div>
    </section>
    <!-- ส่วนท้ายหน้า (footer): ลิงก์ไปหน้า About us และข้อความลิขสิทธิ์ -->
    <footer>
        <div>
            <a href="/team">
                <p class="team">about us</p>
            </a>
        </div>
        <div> 
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>
    <!-- สคริปต์: api.js = เรียก web service, myitem.js = โหลดและลบหนังสือของตัวเอง -->
    <script src="../js/api.js" defer></script>
    <script src="../js/myitem.js" defer></script>
</body>

</html>

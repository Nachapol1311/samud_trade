<!DOCTYPE html>
<html lang="th">

<head>
    <title>Samud Trade | Login</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/login.css" rel="stylesheet" />
</head>

<body class="page-login">
    <!-- ส่วนหัวหน้า (header): โลโก้ลิงก์กลับหน้าแรก (Home Page) และแถบนำทาง (nav) -->
    <header>
        <a href="/home">
            <div>samud trade</div>
        </a>

        <!-- แถบนำทาง (Navigation bar): ยังไม่ได้ login จึงแสดงเฉพาะ search เพราะเมนูอื่นจะพากลับมาหน้านี้อยู่ดี -->
        <nav>
            <div>
                <a class="nav" href="/search">⌕ search</a>
            </div>
        </nav>

        <div class="profile">
            <svg class="profile-icon" viewbox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </div>
    </header>
    <main id="login_content">
        <!-- ฟอร์ม Log-in: login.js ส่ง username / password ไป POST /auth/login -->
        <!-- สำเร็จแล้ว admin ไปหน้า /admin-home ส่วน user ไปหน้า /home -->
        <section class="card">
            <h2>Login for user</h2>
            <form class="form" id="login_form" method="post">
                <label for="username">Username:</label>
                <input autocomplete="username" id="username" name="username" required="" type="text" />
                <label for="password">Password:</label>
                <input autocomplete="current-password" class="pw" id="password" name="password" required=""
                    type="password" />
                <button class="login" type="submit">Login</button>
            </form>
        </section>
    </main>
    <!-- สคริปต์: api.js = เรียก web service, login.js = ส่งฟอร์ม login และเปลี่ยนหน้าหลังเข้าสู่ระบบ -->
    <script src="../js/api.js" defer></script>
    <script src="../js/login.js" defer></script>
</body>

</html>

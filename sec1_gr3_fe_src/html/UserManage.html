<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Samud Trade | Usermanage</title>
    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/UserManage.css" rel="stylesheet" />
</head>

<body class="page-usermanage">
    <header>
        <a href="home.html">
            <div>samud trade</div>
        </a>

        <nav>
            <div>
                <a class="nav" href="ProductManage.html">Product management</a>
            </div>
        </nav>

        <a class="profile" href="login.html">
            <svg class="profile-icon" viewbox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>

    <main class="admin-page" id="UserManage_content">
        <section class="admin-box">
            <div class="admin-header">
                <h2>│User Management</h2>
                <a class="add-user-btn" href="admin-user-add.html">
                    Add user
                </a>
            </div>

            <section class="user-search">
                <label>Search user</label>

                <form action="Get">
                    <input type="text" placeholder="username">
                    <button type="submit">⌕</button>
                </form>
            </section>

            <table class="user-table">
                <thead>
                    <tr>
                        <th class="id-column">Role</th>
                        <th class="username-column">Username</th>
                        <th class="name-column">FirstName - LastName</th>
                        <th class="manage-column">Manage</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        
                        <td>
                            <div class="manage-buttons">
                                <a class="edit-btn" href="edititem.html">Edit</a>
                                <button class="remove-btn" type="button">
                                    Remove
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>

</html>

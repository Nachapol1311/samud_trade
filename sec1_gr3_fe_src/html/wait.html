<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Samud Trade | Wait</title>

    <link rel="stylesheet" href="../css/bar.css">
    <link rel="stylesheet" href="../css/showitem.css">
    <link rel="stylesheet" href="../css/wait.css">
</head>

<body class="page-wait">

    <header>
        <a href="/home">
            <div>samud trade</div>
        </a>

        <nav>
            <div>
                <a class="nav" href="/search">⌕ search</a>
                <span>|</span>
                <a class="nav" href="/trade">trade</a>
                <span>|</span>
                <a class="nav" href="/my-item">my item</a>
                <span>|</span>
                <a class="nav" href="/match">match</a>
                <span>|</span>
                <a class="nav" href="/wait">wait</a>
            </div>
        </nav>

        <a class="profile" href="/profile">
            <svg class="profile-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>

    <main class="wait-page" id="wait_content">

        <h1>│Wait</h1>

        <p class="wait-subtitle">
            Your trade request is waiting for a response.
        </p>

        <section class="wait-container">

            <!-- Trade Request 1 -->
            <div class="wait-request">

                <div class="wait-books">

                    <!-- Offered Book -->
                    <div class="wait-book">
                        <h2>Offered Book</h2>

                        <div class="item">
                            <img src="../pic/item.jpg" alt="Offered Book">

                            <p class="itemname">Book Name</p>
                            <p class="info">Book information</p>

                            <a href="/detail-item">
                                detail
                            </a>
                        </div>
                    </div>

                    <!-- Swap -->
                    <div class="wait-swap">⇄</div>

                    <!-- Your Book -->
                    <div class="wait-book">
                        <h2>Your Book</h2>

                        <div class="item">
                            <img src="../pic/item.jpg" alt="Your Book">

                            <p class="itemname">My Book</p>
                            <p class="info">Book information</p>

                            <a href="/detail-item">
                                detail
                            </a>
                        </div>
                    </div>

                </div>

                <!-- Cancel Request -->
                <div class="wait-actions">
                    <button class="cancel-request-btn" type="button">
                        × Cancel Request
                    </button>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <div>
            <a href="/team">
                <p class="team">about us</p>
            </a>
        </div>

        <div>
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/api.js" defer></script>
    <script src="../js/wait.js" defer></script>
</body>

</html>

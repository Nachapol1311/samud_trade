<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Product</title>
    <link rel="stylesheet" href="../css/bar.css">
    <link rel="stylesheet" href="../css/UserManage.css">
    <link rel="stylesheet" href="../css/product-add.css">
</head>

<body>
    <header>
        <link rel="stylesheet" href="../icon/icon-home.css">
        <a href="home.html" class="home">
            <svg class="home-icon" viewBox="0 0 24 24">
                <path d="M12 3L2 12h3v8h5v-5h4v5h5v-8h3L12 3z" />
            </svg>
        </a>

        <div>samud trade</div>

        <link rel="stylesheet" href="../icon/icon-profile.css">
        <a href="login.html" class="profile">
            <svg class="profile-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9" />
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z" />
            </svg>
        </a>
    </header>

    <nav class="user-nav">

        <a class="product-link">
            Product
        </a>

    </nav>

    <main class="admin-page">

        <section class="admin-box">

            <h2>Add product</h2>

            <form class="add-form" id="addProductForm">

                <!-- รูปปกหนังสือ (คลิกเพื่อเลือกรูป) -->
                <label class="image-upload" id="imageBox">
                    <input type="file" id="cover" name="cover" accept="image/*">
                    <img id="preview" alt="book cover preview">
                    <span>+ Upload<br>book cover</span>
                </label>

                <div class="fields">

                    <div class="field-row">
                        <label for="bookname">Book</label>
                        <input type="text" id="bookname" name="bookname" placeholder="book name" required>
                    </div>

                    <div class="field-row">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="" disabled selected>select category</option>
                            <option>Fiction</option>
                            <option>Non-fiction</option>
                            <option>Textbook</option>
                            <option>Comic / Manga</option>
                            <option>Self-help</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="field-row">
                        <label for="price">Price</label>
                        <input type="number" id="price" name="price" min="0" step="1" placeholder="price (THB)" required>
                    </div>

                    <div class="field-row">
                        <label for="condition">Condition</label>
                        <select id="condition" name="condition" required>
                            <option value="" disabled selected>select condition</option>
                            <option>New</option>
                            <option>Like new</option>
                            <option>Good</option>
                            <option>Fair</option>
                            <option>Worn</option>
                        </select>
                    </div>

                    <div class="field-row">
                        <label for="owner">Owner</label>
                        <input type="text" id="owner" name="owner" placeholder="owner username" required>
                    </div>

                    <p class="detail-title">detail</p>
                    <textarea id="detail" name="detail" placeholder="write something about this book..."></textarea>

                    <div class="form-buttons">
                        <button type="button" class="cancel-btn" onclick="location.href='ProductManage.html'">Cancel</button>
                        <button type="submit" class="save-btn">Add product</button>
                    </div>

                </div>

            </form>

        </section>

    </main>

    <script>
        const cover = document.getElementById('cover');
        const preview = document.getElementById('preview');
        const imageBox = document.getElementById('imageBox');
        const form = document.getElementById('addProductForm');

        // แสดงตัวอย่างรูปที่เลือก
        cover.addEventListener('change', () => {
            const file = cover.files[0];
            if (!file) {
                imageBox.classList.remove('has-image');
                preview.removeAttribute('src');
                return;
            }
            preview.src = URL.createObjectURL(file);
            imageBox.classList.add('has-image');
        });

        // ตอนนี้ยังไม่มี backend: กดบันทึกแล้วกลับไปหน้า ProductManage
        // (ถ้ามี backend แล้ว ให้ส่งข้อมูลฟอร์มก่อนแล้วค่อย redirect)
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            location.href = 'ProductManage.html';
        });
    </script>

</body>

</html>

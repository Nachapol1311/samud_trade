<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Samud Trade | Match</title>
    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/match.css" rel="stylesheet" />
</head>

<body class="page-match">
    <header>
        <a href="home.html">
            <div>samud trade</div>
        </a>

        <nav>
            <div>
                <a class="nav" href="search.html">⌕ search</a>
                <span>|</span>
                <a class="nav" href="trade.html">trade</a>
                <span>|</span>
                <a class="nav" href="myitem.html">my item</a>
                <span>|</span>
                <a class="nav" href="wait.html">wait</a>
            </div>
        </nav>

        <a class="profile" href="login.html">
            <svg class="profile-icon" viewbox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>
    
    <main class="match-container" id="match_content">
        <h1>│Match</h1>
        <!--match 1-->
        <div class="match-content">
            <!--someone else's book-->
            <div class="match-card">
                <img alt="offered item" src="../pic/item.jpg" />
                <p class="itemname">name</p>
                <p class="info">info</p>
                <a class="detail-btn" href="detailitem.html">detail</a>
            </div>
            <span class="exchange">⇄</span>
            <!--my book-->
            <div class="match-card">
                <img alt="my item" src="../pic/item.jpg" />
                <p class="itemname">My book</p>
                <p class="info">info</p>
                <a class="detail-btn" href="detailitem.html">detail</a>
            </div>
            
            <!--accept or reject-->
            <div class="match-button">
                <button class="accept" type="button">✓</button>
                <button class="reject" type="button">✕</button>
            </div>
        </div>
    </main>
    <footer>
        <div>
            <a href="team.html">
                <p class="team">about us</p>
            </a>
        </div>
        <div> 
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>

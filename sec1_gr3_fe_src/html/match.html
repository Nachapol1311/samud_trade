<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Samud Trade | Match</title>

    <link rel="stylesheet" href="../css/bar.css">
    <link rel="stylesheet" href="../css/showitem.css">
    <link rel="stylesheet" href="../css/match.css">
</head>

<body class="page-match">

    <header>
        <a href="/home">
            <div>samud trade</div>
        </a>

        <nav>
            <div>
                <a class="nav" href="/search">⌕ search</a>
                <span>|</span>
                <a class="nav" href="/trade">trade</a>
                <span>|</span>
                <a class="nav" href="/my-item">my item</a>
                <span>|</span>
                <a class="nav" href="/wait">wait</a>
            </div>
        </nav>

        <a class="profile" href="/profile">
            <svg class="profile-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>

    <main class="match-page" id="match_content">

        <h1>│Match</h1>

        <p class="match-subtitle">
            Review the trade proposal and decide to accept or decline.
        </p>


        <section class="match-container">

            <!-- Trade Request 1 -->
            <div class="match-request">

                <div class="match-books">

                    <!-- Offered Book -->
                    <div class="match-book">
                        <h2>Offered Book</h2>

                        <div class="item">
                            <img src="../pic/item.jpg" alt="Offered Book">
                            <p class="itemname">Book Name</p>
                            <p class="info">Book information</p>
                            <a href="/detail-item">detail</a>
                        </div>
                    </div>

                    <div class="swap-icon">⇄</div>

                    <!-- Your Book -->
                    <div class="match-book">
                        <h2>Your Book</h2>

                        <div class="item">
                            <img src="../pic/item.jpg" alt="Your Book">
                            <p class="itemname">My Book</p>
                            <p class="info">Book information</p>
                            <a href="/detail-item">detail</a>
                        </div>
                    </div>

                </div>

                <!-- Buttons -->
                <div class="match-actions">
                    <button class="decline-btn" type="button">
                        × Decline
                    </button>

                    <button class="accept-btn" type="button">
                        ✓ Accept
                    </button>
                </div>

            </div>

            <!-- Trade Request 2 -->
            <!-- เมื่อเชื่อม Database สามารถสร้าง
         .match-request เพิ่มตามจำนวนคำขอได้ -->

        </section>


    </main>

    <footer>
        <div>
            <a href="/team">
                <p class="team">about us</p>
            </a>
        </div>

        <div>
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/api.js" defer></script>
    <script src="../js/match.js" defer></script>
</body>

</html>

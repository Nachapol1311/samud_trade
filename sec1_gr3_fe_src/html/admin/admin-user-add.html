<!DOCTYPE html>
<html lang="en">

<head>
    <title>Samud Trade | Admin User Add</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/usermanage.css" rel="stylesheet" />
    <link href="../css/admin-user-add.css" rel="stylesheet" />
</head>

<body class="page-admin-user-add">
    <!-- ส่วนหัวหน้าของผู้ดูแลระบบ: โลโก้ลิงก์กลับหน้า user-manage, nav ไปหน้า Product management -->
    <header>
        <a href="/user-manage">
            <div>samud trade</div>
        </a>

        <nav>
        
        <div>
            <a class="nav" href="/product-manage">Product management</a>
        </div>
        </nav>

        <a class="profile" href="/login">
            <svg class="profile-icon" viewbox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>
    
    <!-- ฟอร์มเพิ่มบัญชีผู้ใช้ใหม่: adduser.js ตรวจว่ารหัสผ่านกับ Confirm Password ตรงกัน แล้วส่งข้อมูลไป POST /accounts -->
    <main class="admin-page" id="admin_user_add_content">
        <section class="admin-box">
            <h2>Add user</h2>
            <form class="add-user-form" id="addUserForm" method="post">
                <div class="field-row">
                    <label for="Role">Role</label>
                    <select id="admin_user_add_role" name="role">
                        <option value="admin">admin</option>
                        <option value="user">user</option>
                    </select>
                </div>
                <div class="field-row">
                    <label for="firstname">First Name</label>
                    <input id="firstname" name="firstname" placeholder="first name" required="" type="text" />
                </div>
                <div class="field-row">
                    <label for="lastname">Last Name</label>
                    <input id="lastname" name="lastname" placeholder="last name" required="" type="text" />
                </div>
                <div class="field-row">
                    <label for="username">Username</label>
                    <input id="username" name="username" placeholder="username" required="" type="text" />
                </div>
                <div class="field-row">
                    <label for="email">Email</label>
                    <input id="email" name="email" placeholder="email@example.com" required type="email" />
                </div>
                <div class="field-row">
                    <label for="password">Password</label>
                    <input id="password" name="password" placeholder="password" required="" type="password" />
                </div>
                <div class="field-row">
                    <label for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword" name="confirmPassword" placeholder="confirm password" required=""
                        type="password" />
                </div>
                <div class="form-buttons">
                    <a class="cancel-btn" href="/user-manage">
                        Cancel
                    </a>
                    <button class="save-btn" type="submit">
                        Add
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- ส่วนท้ายหน้า (footer): ลิงก์ไปหน้า About us และข้อความลิขสิทธิ์ -->
    <footer>
        <div>
            <a href="/team">
                <p class="team">about us</p>
            </a>
        </div>
        <div> 
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>
    <!-- สคริปต์: api.js = เรียก web service, adduser.js = ส่งฟอร์มเพิ่มบัญชี -->
    <script src="../js/api.js" defer></script>
    <script src="../js/adduser.js" defer></script>
</body>

</html>

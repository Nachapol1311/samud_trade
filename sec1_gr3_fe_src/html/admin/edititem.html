
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <title>Samud Trade | Edit User</title>

    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/edituser.css" rel="stylesheet" />
</head>

<body class="page-admin-user-edit">

    <header>
        <a href="/user-manage">
            <div>samud trade</div>
        </a>

        <nav>
            <div>
                <a class="nav" href="/product-manage">
                    Product management
                </a>
            </div>
        </nav>

        <a class="profile" href="/admin-profile">
            <svg class="profile-icon" viewbox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>

    <main class="admin-edit-box">

        <h2>Edit User</h2>

        <form class="edit-user-form" id="editUserForm"
              >

            <!-- Profile Image -->
            <div class="profile-upload">
                <img src="../pic/profile.jpg"
                     alt="Profile Image"
                     id="profilePreview" />

                <label for="profileImage">
                    Change profile image
                </label>

                <input type="file"
                       id="profileImage"
                       name="profileImage"
                       accept="image/*" />
            </div>

            <!-- User Information -->
            <div class="edit-field">

                <label for="role">Role</label>

                <select id="role" name="role">
                    <option value="admin" selected>admin</option>
                    <option value="user">user</option>
                </select>

            </div>

            <div class="edit-field">

                <label for="firstname">First Name</label>

                <input type="text"
                       id="firstname"
                       name="firstname"
                       placeholder="first name"
                       required />

            </div>

            <div class="edit-field">

                <label for="lastname">Last Name</label>

                <input type="text"
                       id="lastname"
                       name="lastname"
                       placeholder="last name"
                       required />

            </div>

            <div class="edit-field">

                <label for="username">Username</label>

                <input type="text"
                       id="username"
                       name="username"
                       placeholder="username"
                       required />

            </div>

            <div class="edit-field">

                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="email@example.com"
                       required />

            </div>

            <div class="edit-field">

                <label for="password">New Password</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="new password" />

            </div>

            <div class="edit-field">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="confirm new password" />

            </div>

            <p class="password-note">
                Leave password fields blank if you do not want
                to change the current password.
            </p>

            <!-- Buttons -->
            <div class="form-buttons">

                <a href="/user-manage" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="save-btn">
                    Save
                </button>

            </div>

        </form>

    </main>

    <footer>
        <div>
            <a href="/team">
                <p class="team">about us</p>
            </a>
        </div>

        <div>
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/api.js" defer></script>
    <script src="../js/edituser.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Samud Trade | Admin Management</title>

    <link rel="stylesheet" href="../css/bar.css" />
    <link rel="stylesheet" href="../css/management-admin.css" />
</head>

<body class="page-management-admin">

    <!-- Header -->
    <header>
        <a href="/admin-home">
            <div>samud trade</div>
        </a>
        <nav>
            <div>
                <a class="nav" href="/admin-management">
                    management
                </a>
            </div>
        </nav>

        <a class="profile" href="/admin-profile">
            <svg class="profile-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>

    <!-- Main -->
    <main class="management-page">

        <h1>Admin Management</h1>
        <p class="management-subtitle">
            Select management section
        </p>

        <div class="management-container">

            <!-- Product Management -->
            <a href="/product-manage" class="management-card">

                <div class="management-icon">
                    <i data-lucide="book-open"></i>
                </div>
                <h2>Product Management</h2>

                <p>
                    Manage books and products
                </p>

                <span class="management-link">
                    Manage
                </span>

            </a>

            <!-- User Management -->
            <a href="/user-manage" class="management-card">

                <div class="management-icon">
                    <i data-lucide="users-round"></i>
                </div>

                <h2>User Management</h2>

                <p>
                    Manage user accounts
                </p>

                <span class="management-link">
                    Manage
                </span>

            </a>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <div>
            <a href="/team">
                <p class="team">about us</p>
            </a>
        </div>

        <div>
            <p>© 2026 Samud Trade. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>

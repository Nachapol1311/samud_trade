<!DOCTYPE html>
<html lang="en">

<head>
    <title>Samud Trade | Product Management</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />

    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/usermanage.css" rel="stylesheet" />
    <link href="../css/productmanage.css" rel="stylesheet" />
</head>

<body class="page-productmanage">

    <!-- ส่วนหัวหน้าของผู้ดูแลระบบ: โลโก้ลิงก์ไป admin-home, nav ไปหน้า User management และไอคอนโปรไฟล์ลิงก์ไป admin-profile -->
    <header>
        <a href="/admin-home">
            <div>samud trade</div>
        </a>

        <nav>
            <div>
                <a class="nav" href="/user-manage">User management</a>
            </div>
        </nav>

        <a class="profile" href="/admin-profile">
            <svg class="profile-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8.6" r="3.9"></circle>
                <path d="M2.6 24c0-4.3 4.2-7.9 9.4-7.9s9.4 3.6 9.4 7.9z"></path>
            </svg>
        </a>
    </header>


    <!-- เนื้อหาหลัก: หน้าจัดการหนังสือ (Product management) สำหรับผู้ดูแลระบบ ได้แก่ ค้นหา / เพิ่ม / แก้ไข / ลบ -->
    <main class="admin-page" id="ProductManage_content">

        <section class="admin-box">

            <div class="admin-header">
                <h2>│Product Management</h2>

                <a class="add-user-btn" href="/admin-product-add">
                    Add product
                </a>
            </div>


            <!-- ฟอร์มค้นหาหนังสือ: productmanage.js ส่งคำค้นไป GET /books?name=... (ไม่ใส่คำค้น = แสดงหนังสือทั้งหมด) -->
            <section class="product-search">
                <label>Search product</label>
                <form id="productSearchForm">
                    <input id="productSearchInput" type="text" placeholder="book name / keyword">
                    <button type="submit">⌕</button>
                </form>
            </section>


            <!-- ตารางผลลัพธ์: productmanage.js เติมแถวลงใน tbody พร้อมปุ่ม Edit และ Remove (Remove เรียก DELETE /books/:id) -->
            <table class="user-table">

                <thead>
                    <tr>
                        <th class="product-column">Product ID</th>
                        <th class="name-column">Name</th>
                        <th class="manage-column">Manage</th>
                    </tr>
                </thead>

                <tbody id="productTableBody"></tbody>
            </table>
        </section>
    </main>
    <!-- สคริปต์: api.js = เรียก web service, productmanage.js = ค้นหา / ลบหนังสือ -->
    <script src="../js/api.js" defer></script>
    <script src="../js/productmanage.js" defer></script>
</body>

</html>

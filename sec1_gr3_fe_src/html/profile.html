<!DOCTYPE html>
<html lang="th">

<head>
    <title>Samud Trade | Profile</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="../css/bar.css" rel="stylesheet" />
    <link href="../css/profile.css" rel="stylesheet" />
</head>

<body class="page-profile">
    <header>
        <a class="home" href="home.html">
            <svg class="home-icon" viewbox="0 0 24 24">
                <path d="M12 3L2 12h3v8h5v-5h4v5h5v-8h3L12 3z"></path>
            </svg>
        </a>
        <div>samud trade</div>
        <div data-original-style="width:30px"></div>
    </header>
    <main id="profile_content">
        <section class="profile-card">
            <!-- ช่องรูปโปรไฟล์ (ว่างไว้ก่อน) -->
            <div aria-label="profile picture" class="avatar" id="avatar"></div>
            <form action="#" class="form" id="profileForm" method="post">
                <label for="username">Username:</label>
                <input autocomplete="username" disabled="" id="username" name="username" type="text" />
                <label for="firstname">First name:</label>
                <input autocomplete="given-name" disabled="" id="firstname" name="firstname" type="text" />
                <label for="lastname">Last name:</label>
                <input autocomplete="family-name" disabled="" id="lastname" name="lastname" type="text" />
                <label for="email">Email:</label>
                <input autocomplete="email" disabled="" id="email" name="email" type="email" />
                <div class="buttons">
                    <button id="editBtn" type="button">Edit</button>
                    <a href="login.html">Logout</a>
                </div>
            </form>
        </section>
    </main>
    <script defer="" src="../js/profile.js"></script>
</body>

</html>
